<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lock your screen 🐈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="photo">
    <img alt="Zufälliges Katzenfoto" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
  </div>
  <pre role="img" aria-label="Katzen aus Textzeichen"></pre>
  <p aria-live="polite"><span></span></p>
</main>
<header>
  <div>
    <div id="timer"><span>Bildschirm entsperrt seit <time>00:00:00</time></span></div>
    <div id="highscore" aria-live="polite" hidden>
      <span class="best">Highscore <time>00:00:00</time></span>
      <strong class="record"></strong>
    </div>
  </div>
  <button type="button" id="open" aria-label="Einstellungen" title="Einstellungen">⚙</button>
</header>
<dialog id="config" aria-labelledby="config-title">
  <form method="dialog">
    <h2 id="config-title">Einstellungen</h2>
    <button aria-label="Schließen">✕</button>
  </form>
  <fieldset>
    <legend>Modus</legend>
    <button type="button" id="mode" autofocus><span class="to-ascii">Ohne Bilder</span><span class="to-images">Mit Bildern</span></button>
    <button type="button" id="fullscreen" hidden><span class="enter">Vollbild</span><span class="exit">Vollbild beenden</span></button>
  </fieldset>
  <fieldset>
    <legend>Darstellung</legend>
    <label><input type="checkbox" id="dark" checked> Dark Mode</label>
    <label><input type="checkbox" id="inverted" checked> Invertiert</label>
  </fieldset>
  <fieldset>
    <legend>Auto-Reload</legend>
    <label><input type="checkbox" id="autoreload"> Alle <input type="number" id="seconds" value="30" min="1" step="1"> Sekunden neu laden</label>
  </fieldset>
  <!-- TODO: Cataas settings: filter images by tags, color settings, etc.
  <fieldset>
    <legend>Cataas Settings</legend>
  </fieldset>
  -->
  <fieldset class="bottom">
    <legend>Zurücksetzen</legend>
    <button type="button" id="reset-settings" data-confirm="Alle Einstellungen auf Standard zurücksetzen?">Einstellungen zurücksetzen</button>
    <button type="button" id="reset-highscore" data-confirm="Highscore wirklich löschen?">Highscore zurücksetzen</button>
  </fieldset>
</dialog>
<script src="app.js"></script>
</body>
</html>
